<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redis Desktop Web Manager | Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
            },
            surface: {
              700: '#334155',
              800: '#1e293b',
              850: '#151f30',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #26334d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #38496b; }
  </style>
</head>
<body class="bg-surface-950 text-slate-100 flex flex-col h-full antialiased selection:bg-brand-500 selection:text-white overflow-hidden">

  <!-- Top Navbar Minimalista estilo Desktop App -->
  <header class="h-12 bg-surface-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-30 select-none">
    <div class="flex items-center space-x-3">
      <div class="h-7 w-7 rounded-lg bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center text-white font-extrabold text-sm shadow">
        ⚡
      </div>
      <div class="flex items-center space-x-2">
        <span class="font-bold text-sm text-white tracking-tight">Another Redis Web Manager</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">v2.0 Desktop Web (Python 3.14)</span>
      </div>
    </div>

    <!-- Navegação Superior -->
    <div class="flex items-center space-x-2">
      <a href="/" class="px-3 py-1.5 text-xs font-semibold rounded-lg {{ 'bg-slate-800 text-brand-400 border border-slate-700' if request.path == '/' else 'text-slate-400 hover:text-slate-200' }} flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        Manager Explorer
      </a>
      <a href="/cli" class="px-3 py-1.5 text-xs font-semibold rounded-lg {{ 'bg-slate-800 text-brand-400 border border-slate-700' if request.path == '/cli' else 'text-slate-400 hover:text-slate-200' }} flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Terminal CLI
      </a>
      <a href="/settings" class="px-3 py-1.5 text-xs font-semibold rounded-lg {{ 'bg-slate-800 text-brand-400 border border-slate-700' if request.path == '/settings' else 'text-slate-400 hover:text-slate-200' }} flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Configurações (Hosts)
      </a>
    </div>

    <!-- Indicador de Status OpenShift -->
    <div class="flex items-center space-x-3 text-xs text-slate-400">
      <span class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        OCP Cluster Ready
      </span>
    </div>
  </header>

  <!-- Área de Trabalho de 3 Colunas estilo Another Redis Desktop Manager -->
  <div class="flex-1 flex overflow-hidden">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
